# Vanilla Jazzberry - authoritative hardware contract
#
# Machine-readable, corrected replacement for context/robot_hardware_params.md.
# Physical facts live here; the Safety Czar derives limits from this file.
# 2-space indentation, valid YAML.
#
# Two kinds of values:
#   - datasheet_*  : known from the component datasheet (trustworthy now)
#   - measured_*   : requires physical assembly / bench test (null = pending)
# Anything genuinely unknowable before assembly is null with a `pending_*` note.

schema_version: 1
document_status: design_baseline_corrected
config_name: vanilla_jazzberry_hardware

robot:
  name: vanilla_jazzberry
  class: four_wheel_skid_steer_rover
  body_command_model: differential_drive_twist   # linear.x + angular.z only
  actuator_command_model: four_wheel_skid_steer
  lateral_velocity_supported: false

  wheel_layout:
    drive: all_wheel                # all four wheels powered
    axle_groups:
      front: [front_left, front_right]
      rear: [rear_left, rear_right]
    steering: skid                  # differential; no steered axle

  geometry:
    # Unmeasurable until the chassis is physically assembled. Do not invent.
    wheel_radius_m: null            # pending_measurement
    wheel_base_m: null              # pending_measurement (front-rear axle distance)
    track_width_m: null             # pending_measurement (left-right wheel distance)
    ground_clearance_m: null        # pending_measurement
    mass_kg: null                   # pending_measurement

hardware:
  compute:
    model: raspberry_pi_3_model_b_plus
    soc: bcm2837b0
    cpu: cortex_a53_quad_1_4ghz
    ram_mb: 1024
    camera_ports:
      csi2: 1                       # ONE camera port: two CSI cameras need a mux
    analog_inputs: 0                # no ADC on-board; analog sensors need external ADC

  power:
    drive_battery:
      type: lithium_ion_2s          # external RC battery
      chemistry: li_ion
      capacity_mah: 2200
      nominal_v: 7.4
      full_v: 8.4
      empty_v: 6.0
      warn_v: 6.8
      critical_v: 6.3
      telemetry_source: yahboom_board   # read via Rosmaster_Lib.get_battery_voltage
    ups:
      model: pisugar_s_plus
      variant: hardware_only            # the "dumb" S Plus
      battery_telemetry_available: false   # CORRECTED: no server, no telemetry
      role: pi_power_backup

  motor_controller:
    model: yahboom_yb_erf01
    mcu: stm32f103rct6
    usb_bridge: ch340
    usb_id: "1a86:7523"
    device_hint: /dev/ttyUSB0
    baud_datasheet: 115200
    driver_library: rosmaster_lib
    driver_installed: false           # observed: Rosmaster_Lib not installed
    protocol: pending_verification    # unconfirmed until library/board respond
    capabilities:
      motor_count: 4
      encoder_feedback: pending_verification
      battery_voltage_readback: pending_verification
      pwm_control: pending_verification
      onboard_imu: yahboom_onboard_9axis   # 9-axis IMU lives on this board (see sensors.imu_navigation)

  actuators:
    drive_motors:
      count: 4
      type: dc_gear_motor_with_encoder
      encoder:
        present: true
        counts_per_rev: null          # pending_verification (needs datasheet/bench)
        direction_convention: pending_verification
    measured_capabilities:
      max_linear_speed_mps: null      # pending_test
      max_angular_speed_radps: null   # pending_test
      min_actuation_speed_mps: null   # pending_test (deadband)
      braking_distance_m: null        # pending_test
      braking_model: pending_test

  sensors:
    lidar:
      model: slamtec_rplidar_a1       # A1M8
      role: collision_critical
      interface: usb_serial
      usb_bridge: cp2102              # CORRECTED: CP2102, not CH340
      usb_id: "10c4:ea60"
      device_hint: /dev/ttyUSB1
      baud_datasheet: 115200
      datasheet_range_m: [0.15, 12.0]
      datasheet_scan_hz: 5.5          # adjustable ~2-10 Hz
      datasheet_sample_rate_hz: 8000
      datasheet_angular_resolution_deg: 1.0
      measured_confirmed: false       # confirm at runtime with the driver
      ros:
        topic: /scan
        frame_id: lidar_link
        message_type: sensor_msgs/msg/LaserScan

    # SEPARATION OF CONCERN: two inertial sensors, deliberately not shared.
    #   accelerometer_safety (ADXL345, direct I2C) -> Safety Czar only
    #   imu_navigation (Yahboom onboard 9-axis, via serial) -> navigation only
    accelerometer_safety:             # ADXL345 - dedicated Safety Czar sensor
      model: adxl345
      role: safety_motion_evidence
      consumer: safety_czar           # safety only; navigation must not depend on it
      interface: i2c                  # direct I2C: independent of the motor controller
      independent_of: motor_controller  # keeps working if the Yahboom/serial link dies
      i2c_bus: 3                      # software I2C (i2c-gpio) on GPIO23=SDA/GPIO24=SCL (pins 16/18)
      i2c_bus_note: >-
        Hardware I2C-1 (GPIO2/GPIO3, pins 3/5) was damaged during bring-up: GPIO3/SCL
        is stuck low. Relocated to a bit-banged i2c-gpio bus via
        'dtoverlay=i2c-gpio,bus=3,i2c_gpio_sda=23,i2c_gpio_scl=24' in config.txt.
        On the ADXL345 breakout, CS is tied to 3.3V (I2C mode) and SDO to GND (addr 0x53).
      i2c_address: "0x53"             # 0x1d if ALT ADDRESS pin is high
      i2c_devid_register: "0x00"
      i2c_devid_value: "0xe5"         # positive identity check
      axes: 3
      gyroscope: false                # NO gyro: cannot measure yaw rate / heading
      magnetometer: false
      provides:
        linear_acceleration: true     # impact / tip / motion-vs-command plausibility
        tilt_roll_pitch: true         # derived from gravity vector when static
        yaw: false                    # not observable from accel alone
        angular_velocity: false
      ros:
        topic: /safety/accel
        frame_id: safety_accel_link
        message_type: sensor_msgs/msg/Imu
        # accel-only source: orientation_covariance[0] = -1 and
        # angular_velocity_covariance[0] = -1 by ROS convention.
        angular_velocity_available: false
        orientation_available: partial_tilt_only

    imu_navigation:                   # 9-axis IMU integrated on the Yahboom board
      model: yahboom_onboard_9axis    # ICM20948 or MPU9250; confirm chip on assembly
      role: navigation_attitude
      consumer: navigation            # navigation only; NOT a Safety Czar input
      interface: serial_via_motor_controller  # read over CH340 -> STM32 firmware
      access_library: rosmaster_lib
      shares_failure_domain_with: motor_controller  # why it is not trusted for safety
      axes: 9
      gyroscope: true
      accelerometer: true
      magnetometer: true
      provides:
        linear_acceleration: true
        angular_velocity: true        # yaw rate available (unlike the ADXL345)
        orientation: true             # fused roll/pitch/yaw
      driver_installed: false         # pending: Rosmaster_Lib not installed
      identity_confirmed: false       # confirm chip + serial protocol on assembly
      ros:
        topic: /imu/data
        frame_id: imu_link
        message_type: sensor_msgs/msg/Imu

    crash_sensor:
      model: digital_bump_switch
      role: emergency_backstop
      interface: gpio
      gpio_pin: pending_wiring         # pin unknown until wired; not probeable yet
      active_state: pending_wiring
      ros:
        topic: /crash
        frame_id: base_link
        message_type: std_msgs/msg/Bool

    ultrasonic:
      model: hc_sr04_class
      role: advisory
      enabled: false                   # optional; disabled by default
      interface: gpio
      ros:
        topic: /ultrasonic/range
        message_type: sensor_msgs/msg/Range

    camera_primary:
      model: raspberry_pi_camera_module_3   # Sony IMX708, autofocus
      role: navigation_critical
      interface: csi2
      driver: libcamera
      ros:
        topic: /camera/image_raw
        frame_id: camera_link
        message_type: sensor_msgs/msg/Image

    camera_secondary:
      model: raspberry_pi_hq_camera_m12     # Sony IMX477
      role: advisory
      interface: csi2
      simultaneous_with_primary: false      # Pi 3B+ has ONE CSI port; needs a mux
      note: >-
        Cannot run alongside camera_primary on a Pi 3B+ without a CSI
        multiplexer. Treat as swap-in or mux-gated, not concurrent.

  interfaces:
    required_topics:
      command_proposed: /rov2_core/cmd_vel_proposed
      command_approved: /rov2_core/cmd_vel
    odometry:
      source: wheel_encoders
      topic: /odom
      available: pending_verification

# --------------------------------------------------------------------------- #
# Probe plan consumed by probe_hw.py. Read-only checks only.
# --------------------------------------------------------------------------- #
probe:
  schema_version: 1
  config_name: vanilla_jazzberry_hardware
  mode: discover
  checks:
    - id: compute_identity
      type: host_identity
      required: true
      severity: error
      expected: raspberry_pi_3_model_b_plus

    - id: motor_controller_usb
      type: usb_device
      required: true
      severity: error
      usb_ids: ["1a86:7523"]
      note: Yahboom YB-ERF01 via CH340

    - id: motor_controller_serial
      type: serial_port
      required: true
      severity: error
      match_usb_ids: ["1a86:7523"]

    - id: lidar_usb
      type: usb_device
      required: true
      severity: error
      usb_ids: ["10c4:ea60"]
      note: RPLIDAR A1 via CP2102

    - id: lidar_serial
      type: serial_port
      required: true
      severity: error
      match_usb_ids: ["10c4:ea60"]

    - id: i2c_tools_present
      type: command_available
      required: false
      severity: warning
      command: i2cdetect

    - id: safety_accelerometer_presence
      type: i2c_device
      required: false
      severity: warning
      bus: 3
      address: "0x53"
      note: ADXL345 on software I2C bus 3 (GPIO23/24); hw I2C-1/GPIO3 was damaged, see accelerometer_safety

    - id: safety_accelerometer_identity
      type: i2c_devid
      required: false
      severity: warning
      bus: 3
      address: "0x53"
      register: "0x00"
      expected_value: "0xe5"
      note: ADXL345 DEVID confirms the safety accel (no gyro; navigation uses the onboard IMU)

    - id: camera_primary
      type: camera
      required: false
      severity: warning
      note: Pi 3B+ has one CSI port; primary and HQ cameras cannot run together

    - id: pisugar_ups
      type: pisugar
      required: false
      severity: info
      expect_telemetry: false
      note: PiSugar S Plus is hardware-only; absence of a server is expected

    - id: rosmaster_lib
      type: python_module
      required: false
      severity: info
      module: Rosmaster_Lib
      note: Gates motor control, Yahboom battery readback, and the onboard 9-axis navigation IMU

    # ----------------------------------------------------------------------- #
    # Active checks: open the device read-only and confirm it RESPONDS (not
    # just that it enumerates). These never actuate the vehicle. They degrade
    # to 'unavailable' when the board/LIDAR is off or silent.
    # ----------------------------------------------------------------------- #
    - id: motor_board_responsive
      type: rosmaster_board
      required: false
      severity: warning
      match_usb_ids: ["1a86:7523"]
      note: Confirms the Yahboom/STM32 board answers over serial via Rosmaster_Lib (no motion issued)

    - id: navigation_imu_active
      type: rosmaster_imu
      required: false
      severity: warning
      note: Reads the Yahboom onboard 9-axis IMU over serial (navigation only; excluded from safety)

    - id: drive_encoders_active
      type: rosmaster_encoders
      required: false
      severity: warning
      expected_count: 4
      note: Confirms 4 wheel-encoder channels report; spin wheels to confirm counts change

    - id: battery_voltage_active
      type: rosmaster_battery
      required: false
      severity: warning
      min_voltage: 5.5
      max_voltage: 13.0
      note: Reads pack voltage over serial (2S Li-ion nominal; wide bounds to avoid false alarms)

    - id: lidar_health_active
      type: rplidar_health
      required: false
      severity: warning
      match_usb_ids: ["10c4:ea60"]
      note: Queries RPLIDAR GET_HEALTH/GET_INFO; keeps the scan motor stopped (read-only)

    - id: stable_serial_symlink
      type: file_present
      required: false
      severity: info
      path: /dev/myserial
      note: Yahboom udev symlink for a stable board port; ttyUSB ordering is not guaranteed across reboots

    - id: power_integrity
      type: host_throttling
      required: false
      severity: warning
      note: vcgencmd undervoltage/thermal throttling - a top cause of brownouts under motor load

    - id: rootfs_free_space
      type: disk_space
      required: false
      severity: info
      path: /
      min_free_gb: 1.0
      note: Low SD-card space crashes logging; warn before it bites

    - id: crash_sensor_gpio
      type: gpio_input
      required: false
      severity: info
      gpio_pin: pending_wiring      # set to the BCM pin number once wired; active_high/pull then apply
      note: Passive bump switch is not auto-detectable; reads level only once a pin is configured
